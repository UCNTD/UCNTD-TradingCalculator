<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UCN TD Trade Calculator</title>
<style>
:root{--bg:#07040f;--panel:#0d0818;--line:#5b3fd6;--text:#f4f0ff;--mute:#9a8fc4;--red:#ff2d55;--blue:#38b6ff;--purple:#b45cff;--green:#39ff88;--yellow:#ffd23f;--ctl:#1a1030;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;border-radius:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:10px/1.7 "Press Start 2P","Courier New",monospace;image-rendering:pixelated}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px);z-index:9}
nav{border-bottom:4px solid var(--line);padding:18px 20px;font-size:16px;color:var(--yellow);text-shadow:3px 3px 0 var(--red);letter-spacing:2px}
.wrap{max-width:1280px;margin:0 auto;padding:24px 16px 48px}
.tools{display:flex;gap:12px;justify-content:center;margin-bottom:28px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;max-width:1260px;margin:0 auto}
@media(max-width:760px){.grid{grid-template-columns:1fr;gap:28px}}
.box{background:var(--panel);border:4px solid var(--line);box-shadow:6px 6px 0 #000,inset 0 0 0 2px #000}
.head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;margin-bottom:16px;gap:8px}
.head h2{margin:0;font-size:clamp(14px,2.4vw,22px);font-weight:400}
.t0{color:var(--red);text-shadow:3px 3px 0 #000}
.t1{color:var(--blue);text-shadow:3px 3px 0 var(--purple)}
button{font:inherit;color:var(--text);background:var(--ctl);border:4px solid var(--line);padding:10px 12px;min-height:40px;cursor:pointer;box-shadow:4px 4px 0 #000}
button:hover{background:var(--line)}
button:active{transform:translate(4px,4px);box-shadow:none}
input{font:inherit;color:var(--text);background:var(--ctl);border:4px solid var(--line);padding:10px;width:100%}
:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
.plus{width:52px;height:52px;font-size:22px;padding:0;color:var(--green)}
.items{min-height:300px;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;align-content:start}
.empty{color:var(--mute);grid-column:1/-1;text-align:center;padding-top:110px}
.gb{border:4px solid transparent;background:linear-gradient(#120a24,#120a24) padding-box,linear-gradient(135deg,var(--g)) border-box}
.pl button.gb:hover{background:linear-gradient(#2a1a4d,#2a1a4d) padding-box,linear-gradient(135deg,var(--g)) border-box}
.top{display:flex;gap:10px;align-items:center}
.pic{width:64px;height:64px;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--yellow);overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block}
.item{padding:10px;display:grid;gap:6px}
.nm{color:var(--yellow);word-break:break-word}
.val{color:var(--green)}
.meta{color:var(--mute);font-size:8px;line-height:1.8}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--blue)}
.ctrl{display:flex;gap:6px;align-items:center;margin-top:4px}
.q{min-width:34px;min-height:34px;padding:0}
.ctrl b{min-width:22px;text-align:center;font-weight:400}
.ctrl .x{margin-left:auto;color:var(--red)}
.total{margin-top:20px;border:4px solid var(--green);padding:16px;text-align:center;color:var(--green);box-shadow:6px 6px 0 #000}
.total small{display:block;color:var(--mute);font-size:8px;margin-top:6px}
.status{max-width:1000px;margin:44px auto 0;padding:20px;text-align:center;border:4px solid var(--line);background:var(--panel);box-shadow:6px 6px 0 #000}
.status b{font-weight:400;font-size:clamp(20px,5vw,34px);color:var(--mute)}
.status p{margin:10px 0 0;color:var(--mute);font-size:9px}
.status.win{border-color:var(--green)}.status.win b{color:var(--green)}
.status.lose{border-color:var(--red)}.status.lose b{color:var(--red)}
.status.fair{border-color:var(--blue)}.status.fair b{color:var(--blue)}
@media(prefers-reduced-motion:no-preference){.status:not(.win):not(.lose):not(.fair) b{animation:bl 1.2s steps(2) infinite}@keyframes bl{50%{opacity:.25}}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.on{display:flex}
.modal{width:min(560px,100%);max-height:82vh;display:flex;flex-direction:column;padding:16px;gap:12px}
.pl{overflow:auto;display:grid;gap:8px;padding-right:4px}
.pl h3{margin:10px 0 0;font-size:9px;color:var(--purple);font-weight:400}
.pl button{text-align:left;display:flex;justify-content:space-between;gap:8px;font-size:9px}
</style>
</head>
<body>
<nav>UCN TD CENTRAL</nav>
<div class="wrap">
  <div class="tools">
    <button id="copy" title="Copy trade as text" aria-label="Copy trade as text">Copy</button>
    <button id="clear" title="Clear trade" aria-label="Clear trade">Clear</button>
  </div>
  <div class="grid">
    <section><div class="box head"><h2 class="t0">TRADING</h2><button class="plus" data-open="0" aria-label="Add unit to trading">+</button></div>
      <div class="box items" id="list0"></div><div class="total" id="tot0"></div></section>
    <section><div class="box head"><h2 class="t1">LOOKING FOR</h2><button class="plus" data-open="1" aria-label="Add unit to looking for">+</button></div>
      <div class="box items" id="list1"></div><div class="total" id="tot1"></div></section>
  </div>
  <div class="status" id="status"><b>WAITING</b></div>
</div>
<div class="ov" id="ov"><div class="box modal"><input id="srch" type="search" placeholder="Search units" aria-label="Search units"><div class="pl" id="pl"></div><button id="close">Close</button></div></div>

function pic(u){var f=u[0].toLowerCase().replace(/[^a-z0-9]/g,"");return '<div class="pic gb" style="'+gs(u[1])+'"><img src="'+(IMG[f]||'images/'+f+'.png')+'" alt="" onerror="this.outerHTML=\''+u[0].charAt(0).toUpperCase()+'\'"></div>'}
function drawPicker(){
  var q=$("srch").value.trim().toLowerCase(),h="";
  RAR.forEach(function(r){
    var rows=D.map(function(u,k){return [u,k]}).filter(function(p){return p[0][1]===r&&p[0][0].toLowerCase().indexOf(q)>-1});
    if(!rows.length)return;
    h+="<h3>"+r.toUpperCase()+"</h3>"+rows.map(function(p){return '<button class="gb" style="'+gs(p[0][1])+'" data-pick="'+p[1]+'"><span>'+esc(p[0][0])+'</span><span class="meta">'+rangeTxt(p[0])+'</span></button>'}).join("");
  });
  $("pl").innerHTML=h||'<div class="meta">No units match.</div>';
}
function openPicker(i){target=i;$("srch").value="";drawPicker();$("ov").classList.add("on");$("srch").focus()}
function closePicker(){$("ov").classList.remove("on")}
function add(k){
  var u=D[k],ex=sides[target].find(function(r){return r.k===k});
  if(ex)ex.q++;else sides[target].push({k:k,q:1});
  closePicker();render();
}

function sums(){
  var t=[0,0],miss=[0,0],drop=[0,0];
  [0,1].forEach(function(i){sides[i].forEach(function(r){
    var u=D[r.k];if(u[2]===null)miss[i]++;else t[i]+=(u[2]+u[3])/2*r.q;
    if(trend(D[r.k][5])==="down")drop[i]++;
  })});
  return {t:t,miss:miss,drop:drop};
}
function totals(s){
  [0,1].forEach(function(i){
    $("tot"+i).innerHTML="TOTAL VALUE: "+fmt(s.t[i])+(s.miss[i]?"<small>"+s.miss[i]+" O/C unit(s) not counted</small>":"");
  });
  var el=$("status");
  if(!sides[0].length||!sides[1].length){el.className="status";el.innerHTML="<b>WAITING</b>";return}
  var give=s.t[0],get=s.t[1],diff=get-give,big=Math.max(give,get)||1,pct=Math.abs(diff)/big*100,cls,head;
  if(pct<=10){cls="fair";head="FAIR"}else if(diff>0){cls="win";head="WIN"}else{cls="lose";head="LOSE"}
  var msg=cls==="fair"?"Within 10% ("+fmt(Math.abs(diff))+" shards apart)":(diff>0?"You gain ":"You lose ")+fmt(Math.abs(diff))+" shards ("+Math.round(pct)+"%)";
  if(s.miss[0]||s.miss[1])msg+=". Some units are O/C and not counted, so this may be off";
  if(s.drop[1])msg+=". "+s.drop[1]+" unit(s) you get are dropping in value";
  el.className="status "+cls;el.innerHTML="<b>"+head+"</b><p>"+msg+"</p>";
}

function render(){
  [0,1].forEach(function(i){
    var h=sides[i].map(function(r,idx){
      var u=D[r.k];
      var mid=u[2]===null?"O/C":fmt((u[2]+u[3])/2*r.q)+" shards";
      return '<div class="item gb" style="'+gs(u[1])+'"><div class="top">'+pic(u)+'<div><div class="nm">'+esc(u[0])+'</div><div class="val">'+mid+'</div></div></div><div class="meta">'+u[1]+' | '+rangeTxt(u)+'</div>'+
        '<div class="meta">'+(u[4]?'demand '+esc(u[4]):'')+(u[5]?' | <span class="'+trend(u[5])+'">'+esc(u[5])+'</span>':'')+'</div>'+
        '<div class="ctrl"><button class="q" data-q="'+i+','+idx+',-1" aria-label="Fewer">-</button><b>'+r.q+'</b><button class="q" data-q="'+i+','+idx+',1" aria-label="More">+</button>'+
        '<button class="q x" data-rm="'+i+','+idx+'" aria-label="Remove">x</button></div></div>';
    }).join("");
    $("list"+i).innerHTML=h||'<div class="empty">Press + to add units</div>';
  });
  totals(sums());
}

document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var a;
  if(b.dataset.open!==undefined)return openPicker(+b.dataset.open);
  if(b.dataset.pick!==undefined)return add(+b.dataset.pick);
  if(b.id==="close")return closePicker();
  if(b.id==="clear"){sides=[[],[]];return render()}
  if(b.id==="copy"){
    var s=sums(),line=function(i){return sides[i].map(function(r){return D[r.k][0]+" x"+r.q}).join(", ")||"nothing"};
    var txt="Trading: "+line(0)+" ("+fmt(s.t[0])+")\nLooking for: "+line(1)+" ("+fmt(s.t[1])+")\n"+$("status").querySelector("b").textContent;
    try{navigator.clipboard.writeText(txt);b.textContent="Copied"}catch(err){b.textContent="Failed"}
    setTimeout(function(){b.textContent="Copy"},1200);return;
  }
  if(b.dataset.q){a=b.dataset.q.split(",").map(Number);var r=sides[a[0]][a[1]];r.q+=a[2];if(r.q<1)sides[a[0]].splice(a[1],1);render()}
  if(b.dataset.rm){a=b.dataset.rm.split(",").map(Number);sides[a[0]].splice(a[1],1);render()}
});
document.addEventListener("input",function(e){if(e.target.id==="srch")drawPicker()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closePicker()});
$("ov").addEventListener("click",function(e){if(e.target===$("ov"))closePicker()});
render();
</script>
