<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UCN TD Trade Calculator</title>
<style>
:root{--bg:#07040f;--panel:#0d0818;--line:#5b3fd6;--text:#f4f0ff;--mute:#9a8fc4;--red:#ff2d55;--blue:#38b6ff;--purple:#b45cff;--green:#39ff88;--yellow:#ffd23f;--ctl:#1a1030;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;border-radius:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:10px/1.7 "Press Start 2P","Courier New",monospace;image-rendering:pixelated}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px);z-index:9}
nav{border-bottom:4px solid var(--line);padding:18px 20px;font-size:16px;color:var(--yellow);text-shadow:3px 3px 0 var(--red);letter-spacing:2px}
.wrap{max-width:1280px;margin:0 auto;padding:24px 16px 48px}
.tools{display:flex;gap:12px;justify-content:center;margin-bottom:28px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;max-width:1260px;margin:0 auto}
@media(max-width:760px){.grid{grid-template-columns:1fr;gap:28px}}
.box{background:var(--panel);border:4px solid var(--line);box-shadow:6px 6px 0 #000,inset 0 0 0 2px #000}
.head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;margin-bottom:16px;gap:8px}
.head h2{margin:0;font-size:clamp(14px,2.4vw,22px);font-weight:400}
.t0{color:var(--red);text-shadow:3px 3px 0 #000}
.t1{color:var(--blue);text-shadow:3px 3px 0 var(--purple)}
button{font:inherit;color:var(--text);background:var(--ctl);border:4px solid var(--line);padding:10px 12px;min-height:40px;cursor:pointer;box-shadow:4px 4px 0 #000}
button:hover{background:var(--line)}
button:active{transform:translate(4px,4px);box-shadow:none}
input{font:inherit;color:var(--text);background:var(--ctl);border:4px solid var(--line);padding:10px;width:100%}
:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
.plus{width:52px;height:52px;font-size:22px;padding:0;color:var(--green)}
.items{min-height:300px;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;align-content:start}
.empty{color:var(--mute);grid-column:1/-1;text-align:center;padding-top:110px}
.gb{border:4px solid transparent;background:linear-gradient(#120a24,#120a24) padding-box,linear-gradient(135deg,var(--g)) border-box}
.pl button.gb:hover{background:linear-gradient(#2a1a4d,#2a1a4d) padding-box,linear-gradient(135deg,var(--g)) border-box}
.top{display:flex;gap:10px;align-items:center}
.pic{width:64px;height:64px;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--yellow);overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block}
.item{padding:10px;display:grid;gap:6px}
.nm{color:var(--yellow);word-break:break-word}
.val{color:var(--green)}
.meta{color:var(--mute);font-size:8px;line-height:1.8}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--blue)}
.ctrl{display:flex;gap:6px;align-items:center;margin-top:4px}
.q{min-width:34px;min-height:34px;padding:0}
.ctrl b{min-width:22px;text-align:center;font-weight:400}
.ctrl .x{margin-left:auto;color:var(--red)}
.total{margin-top:20px;border:4px solid var(--green);padding:16px;text-align:center;color:var(--green);box-shadow:6px 6px 0 #000}
.total small{display:block;color:var(--mute);font-size:8px;margin-top:6px}
.status{max-width:1000px;margin:44px auto 0;padding:20px;text-align:center;border:4px solid var(--line);background:var(--panel);box-shadow:6px 6px 0 #000}
.status b{font-weight:400;font-size:clamp(20px,5vw,34px);color:var(--mute)}
.status p{margin:10px 0 0;color:var(--mute);font-size:9px}
.status.win{border-color:var(--green)}.status.win b{color:var(--green)}
.status.lose{border-color:var(--red)}.status.lose b{color:var(--red)}
.status.fair{border-color:var(--blue)}.status.fair b{color:var(--blue)}
@media(prefers-reduced-motion:no-preference){.status:not(.win):not(.lose):not(.fair) b{animation:bl 1.2s steps(2) infinite}@keyframes bl{50%{opacity:.25}}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.on{display:flex}
.modal{width:min(780px,100%);height:82vh;display:flex;flex-direction:row;padding:16px;gap:14px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.side{flex:none;width:130px;display:flex;flex-direction:column;gap:8px;overflow:auto;padding:10px;background:var(--bg);border:4px solid var(--line)}
.side button{font-size:8px;padding:8px 6px;min-height:36px;text-align:left}
.side button.on{background:var(--line);outline:3px solid var(--yellow);outline-offset:-3px}
@media(max-width:520px){.side{width:96px}.side button{font-size:7px}}
.pl{overflow:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px;padding:4px;min-height:0}
.pl .meta{flex:0 0 100%}
.pl button.ic{flex:0 0 84px;width:84px;height:84px;min-height:0;padding:4px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:7px;line-height:1.4;word-break:break-word;overflow:hidden}
.pl button.ic img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block}
/* values page */
nav{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
nav .tab{font-size:9px;padding:8px 12px;min-height:34px;color:var(--text);text-shadow:none;letter-spacing:0}
nav .tab.on{background:var(--line);outline:3px solid var(--yellow);outline-offset:-3px}
.vbar{display:flex;gap:12px;max-width:820px;margin:0 auto 20px}
.vbar input{flex:1;min-width:0}
.vfp{max-width:820px;margin:0 auto 20px;padding:14px;display:none;gap:10px;flex-wrap:wrap;align-items:center}
.vfp.on{display:flex}
.vfp .lbl{flex:0 0 100%;color:var(--mute);font-size:8px;margin-top:4px}
.vfp button{font-size:8px;padding:8px 10px;min-height:34px}
.vfp button.on{background:var(--line);outline:3px solid var(--yellow);outline-offset:-3px}
.pg{display:flex;align-items:center;justify-content:center;gap:10px;font-size:9px;margin-bottom:24px}
.pg button{min-width:40px;padding:6px}
.pg button:disabled{opacity:.35;cursor:default;box-shadow:none}
.pg input{width:64px;text-align:center;padding:6px}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;max-width:1260px;margin:0 auto}
.vc{padding:12px;background:#0d0818}
.vc .nm{font-size:9px;line-height:1.6}
.vc .tag{display:inline-block;margin-top:6px;padding:3px 6px;border:2px solid var(--blue);color:var(--blue);font-size:7px}
.vc .cg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;padding-top:10px;border-top:2px solid #2a1a4d}
.vc .cg small{display:block;color:var(--mute);font-size:7px;margin-bottom:3px}
.vc .cg span{font-size:8px;line-height:1.5;word-break:break-word}
.vg .meta{grid-column:1/-1;text-align:center}
</style>
</head>
<body>
<nav><span>UCN TD CENTRAL</span><button class="tab on" data-view="calc">CALCULATOR</button><button class="tab" data-view="vals">VALUES</button></nav>
<div class="wrap" id="pgCalc">
  <div class="tools">
    <button id="copy" title="Copy trade as text" aria-label="Copy trade as text">Copy</button>
    <button id="clear" title="Clear trade" aria-label="Clear trade">Clear</button>
  </div>
  <div class="grid">
    <section><div class="box head"><h2 class="t0">TRADING</h2><button class="plus" data-open="0" aria-label="Add unit to trading">+</button></div>
      <div class="box items" id="list0"></div><div class="total" id="tot0"></div></section>
    <section><div class="box head"><h2 class="t1">LOOKING FOR</h2><button class="plus" data-open="1" aria-label="Add unit to looking for">+</button></div>
      <div class="box items" id="list1"></div><div class="total" id="tot1"></div></section>
  </div>
  <div class="status" id="status"><b>WAITING</b></div>
</div>
<div class="wrap" id="pgVals" hidden>
  <div class="vbar"><input id="vq" type="search" placeholder="SEARCH UNIT..." aria-label="Search unit"><button id="vfb">FILTERS</button></div>
  <div class="box vfp" id="vfp"></div>
  <div class="pg"><button id="vpp" aria-label="Previous page">&lt;</button>PAGE<input id="vpn" type="number" min="1" value="1" aria-label="Page number">OF <span id="vpt">1</span><button id="vpx" aria-label="Next page">&gt;</button></div>
  <div class="vg" id="vg"></div>
</div>
<div class="ov" id="ov"><div class="box modal"><div class="side" id="side"></div><div class="main"><input id="srch" type="search" placeholder="Search units" aria-label="Search units"><div class="pl" id="pl"></div><button id="close">Close</button></div></div></div>
<script>
// VALUES ARE LOCKED. Only edit this list to change them.
// [name, rarity, low, high (null = O/C, not counted), demand, status]
var D=[
 // normal
["Freddy","Common",1,5,"",""],["Chica","Common",3,7,"",""],
["WitherdBonnie","Rare",10,15,"O/C",""],["ToyChica","Rare",7,10,"O/C",""],["Bonnie","Rare",7,10,"O/C",""],
["PaperPals","Epic",25,37,"1-2/10",""],["ToyBonnie","Epic",10,13,"1/10",""],["ClownBalloonBoy","Epic",5,10,"3-4/10",""],
["Foxy","Legendary",30,45,"2/10",""],["WitherdFoxy","Legendary",25,40,"2-3/10",""],["ToyFreddy","Legendary",30,45,"5/10",""],["PumpkinFreddy","Legendary",20,25,"4.5/10",""],
["ZombieFoxy","Secret",150,200,"5-6/10","slowly dropping"],["Puppet","Secret",100,125,"4.5/10","dropping"],["GoldenFreddy","Secret",100,125,"5/10","slowly dropping"],["Endo02","Secret",100,130,"6.5/10","slowly dropping"],["WhiteRabbit","Secret",1000,1000,"7.5/10","slowly rising"],["WitherdFreddy","Secret",300,300,"9/10","slowly rising"],
["BalloonBoy","Limited",null,null,"O/C","neutral"],["CakeTreat","Limited",null,null,"O/C","neutral"],["RedBear","Limited",null,null,"O/C","rising"],["BrokenSpringLocks","Limited",null,null,"O/C","slowly dropping"],["GrimFoxy","Limited",null,null,"O/C","slowly dropping"],
["MechBonnie","Limited",null,null,"O/C","slowly dropping"],
["WitherdGoldenFreddy","Nightmare",400,475,"4/10","dropping"],["ToyGoldenFreddy","Nightmare",null,null,"O/C","neutral"],["ShadowBuddys","Nightmare",1000,1000,"8/10","slowly rising"],["PhantomTrap","Nightmare",600,600,"7-8/10","neutral"],
["NightTerror","Nightmare",675,750,"4/10","dropping"],["JackO'LanternBonnie","Nightmare",560,560,"7.5/10","neutral"],["ErrorPuppet","Nightmare",null,null,"O/C","slowly rising"],
["MalwareLolbit","Forgotten",null,null,"O/C","rising"],["Sparky","Forgotten",null,null,"O/C","neutral"],["VampirePurpleGuy","Forgotten",null,null,"O/C","neutral"],
["KingScott","Apex",null,null,"O/C","neutral"],["HorrorSpringTrap","Apex",null,null,"O/C","slowly rising"],["Agony","Item",null,null,"O/C","O/C"],["WhiteGlass","Item",null,null,"O/C","O/C"],
["Tv","Item",null,null,"O/C","O/C"],["SwordShard","Item",null,null,"O/C","O/C"],["Paper","Item",null,null,"O/C","O/C"],["Season1Gift","Item",null,null,"100","100"],["Endo01Gift","Item",null,null,"O/C","O/C"],
["Endo02Gift","Item",null,null,"O/C","O/C"],

// shiny

["ShinyFreddy","Common",5,10,"",""],["ShinyChica","Common",7,12,"",""],
["ShinyWitherdBonnie","Rare",10,15,"O/C",""],["ShinyToyChica","Rare",7,10,"O/C",""],["ShinyBonnie","Rare",7,10,"O/C",""],
["ShinyPaperPals","Epic",25,37,"1-2/10",""],["ShinyToyBonnie","Epic",10,13,"1/10",""],["ShinyClownBalloonBoy","Epic",5,10,"3-4/10",""],
["ShinyFoxy","Legendary",30,45,"2/10",""],["ShinyWitherdFoxy","Legendary",25,40,"2-3/10",""],["ShinyToyFreddy","Legendary",30,45,"5/10",""],["ShinyPumpkinFreddy","Legendary",20,25,"4.5/10",""],
["ShinyZombieFoxy","Secret",150,200,"5-6/10","slowly dropping"],["ShinyPuppet","Secret",100,125,"4.5/10","dropping"],["ShinyGoldenFreddy","Secret",100,125,"5/10","slowly dropping"],["ShinyEndo02","Secret",100,130,"6.5/10","slowly dropping"],["ShinyWhiteRabbit","Secret",1000,1000,"7.5/10","slowly rising"],
["ShinyWitherdFreddy","Secret",300,300,"9/10","slowly rising"],["ShinyBalloonBoy","Limited",null,null,"O/C","neutral"],["ShinyCakeTreat","Limited",null,null,"O/C","neutral"],["ShinyRedBear","Limited",null,null,"O/C","rising"],
["ShinyBrokenSpringLocks","Limited",null,null,"O/C","slowly dropping"],["ShinyGrimFoxy","Limited",null,null,"O/C","slowly dropping"],["ShinyMechBonnie","Limited",null,null,"O/C","slowly dropping"],
["ShinyWitherdGoldenFreddy","Nightmare",400,475,"4/10","dropping"],["ShinyToyGoldenFreddy","Nightmare",null,null,"O/C","neutral"],["ShinyShadowBuddys","Nightmare",1000,1000,"8/10","slowly rising"],
["ShinyPhantomTrap","Nightmare",600,600,"7-8/10","neutral"],["ShinyNightTerror","Nightmare",675,750,"4/10","dropping"],["ShinyJackO'LanternBonnie","Nightmare",560,560,"7.5/10","neutral"],
["ShinyErrorPuppet","Nightmare",null,null,"O/C","slowly rising"],["ShinyMalwareLolbit","Forgotten",null,null,"O/C","rising"],["ShinySparky","Forgotten",null,null,"O/C","neutral"],["ShinyVampirePurpleGuy","Forgotten",null,null,"O/C","neutral"],
["ShinyKingScott","Apex",null,null,"O/C","neutral"],["ShinyHorrorSpringTrap","Apex",null,null,"O/C","slowly rising"]
];
var RC={Common:["#ffffff","#9c9c9c"],Rare:["#57aeff","#3690e3"],Epic:["#6200ff","#3e00a1"],Legendary:["#fff700","#fffa61"],Secret:["#d10000","#5c0000"],Limited:["#fff982","#ff8282","#82ffae","#82cbff"],Nightmare:["#000000","#ffffff"],Forgotten:["#00ffd0","#00a3ff","#7a5cff"],Apex:["#6a1bff","#ff1744"],Item:["#39ff88","#38b6ff"]};
function gs(r){var c=RC[r]||["#5b3fd6","#5b3fd6"];return '--g:'+c.join(',')}
var RAR=["Common","Rare","Epic","Legendary","Secret","Limited","Nightmare","Forgotten","Apex","Item"];
var cat="All";
var sides=[[],[]],target=0;
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(n){return (Math.round(n*10)/10).toLocaleString()}
function trend(s){return /rising/.test(s)?"up":/dropping/.test(s)?"down":"flat"}
function rangeTxt(u){return u[2]===null?"no listed value":(u[2]===u[3]?fmt(u[2]):fmt(u[2])+"-"+fmt(u[3]))+" shards"}

// Tower pictures: put files in an "images" folder named after the unit, lowercase, letters and numbers only (freddy.png, witherdbonnie.png). Missing pictures show a letter block.
function pic(u){var f=u[0].toLowerCase().replace(/[^a-z0-9]/g,"");return '<div class="pic gb" style="'+gs(u[1])+'"><img class="pi" data-name="'+esc(u[0])+'" data-ph="'+esc(u[0].charAt(0).toUpperCase())+'" src="images/'+f+'.png" alt=""></div>'}
function drawSide(){
  $("side").innerHTML=["All"].concat(RAR).map(function(r){
    var st=r==="All"?"":' style="'+gs(r)+'"';
    return '<button class="'+(r==="All"?"":"gb ")+(r===cat?"on":"")+'" data-cat="'+r+'"'+st+'>'+r.toUpperCase()+'</button>';
  }).join("");
}
function drawPicker(){
  var q=$("srch").value.trim().toLowerCase();
  var rows=D.map(function(u,k){return [u,k]}).filter(function(p){return (cat==="All"||p[0][1]===cat)&&p[0][0].toLowerCase().indexOf(q)>-1});
  rows.sort(function(x,y){return RAR.indexOf(x[0][1])-RAR.indexOf(y[0][1])});
  var h=rows.map(function(p){return '<button class="gb ic" style="'+gs(p[0][1])+'" data-pick="'+p[1]+'" title="'+esc(p[0][0]+' - '+rangeTxt(p[0]))+'" aria-label="'+esc(p[0][0])+'"><img class="pi" data-name="'+esc(p[0][0])+'" src="images/'+p[0][0].toLowerCase().replace(/[^a-z0-9]/g,"")+'.png" alt=""></button>'}).join("");
  $("pl").innerHTML=h||'<div class="meta">'+(cat==="Item"&&!q?"No items yet.":"No units match.")+'</div>';
  drawSide();
}
function openPicker(i){target=i;$("srch").value="";drawPicker();$("ov").classList.add("on");$("srch").focus()}
function closePicker(){$("ov").classList.remove("on")}
function add(k){
  var u=D[k],ex=sides[target].find(function(r){return r.k===k});
  if(ex)ex.q++;else sides[target].push({k:k,q:1});
  closePicker();render();
}

function sums(){
  var t=[0,0],miss=[0,0],drop=[0,0];
  [0,1].forEach(function(i){sides[i].forEach(function(r){
    var u=D[r.k];if(u[2]===null)miss[i]++;else t[i]+=(u[2]+u[3])/2*r.q;
    if(trend(D[r.k][5])==="down")drop[i]++;
  })});
  return {t:t,miss:miss,drop:drop};
}
function totals(s){
  [0,1].forEach(function(i){
    $("tot"+i).innerHTML="TOTAL VALUE: "+fmt(s.t[i])+(s.miss[i]?"<small>"+s.miss[i]+" O/C unit(s) not counted</small>":"");
  });
  var el=$("status");
  if(!sides[0].length||!sides[1].length){el.className="status";el.innerHTML="<b>WAITING</b>";return}
  var give=s.t[0],get=s.t[1],diff=get-give,big=Math.max(give,get)||1,pct=Math.abs(diff)/big*100,cls,head;
  if(pct<=10){cls="fair";head="FAIR"}else if(diff>0){cls="win";head="WIN"}else{cls="lose";head="LOSE"}
  var msg=cls==="fair"?"Within 10% ("+fmt(Math.abs(diff))+" shards apart)":(diff>0?"You gain ":"You lose ")+fmt(Math.abs(diff))+" shards ("+Math.round(pct)+"%)";
  if(s.miss[0]||s.miss[1])msg+=". Some units are O/C and not counted, so this may be off";
  if(s.drop[1])msg+=". "+s.drop[1]+" unit(s) you get are dropping in value";
  el.className="status "+cls;el.innerHTML="<b>"+head+"</b><p>"+msg+"</p>";
}

function render(){
  [0,1].forEach(function(i){
    var h=sides[i].map(function(r,idx){
      var u=D[r.k];
      var mid=u[2]===null?"O/C":fmt((u[2]+u[3])/2*r.q)+" shards";
      return '<div class="item gb" style="'+gs(u[1])+'"><div class="top">'+pic(u)+'<div><div class="nm">'+esc(u[0])+'</div><div class="val">'+mid+'</div></div></div><div class="meta">'+u[1]+' | '+rangeTxt(u)+'</div>'+
        '<div class="meta">'+(u[4]?'demand '+esc(u[4]):'')+(u[5]?' | <span class="'+trend(u[5])+'">'+esc(u[5])+'</span>':'')+'</div>'+
        '<div class="ctrl"><button class="q" data-q="'+i+','+idx+',-1" aria-label="Fewer">-</button><b>'+r.q+'</b><button class="q" data-q="'+i+','+idx+',1" aria-label="More">+</button>'+
        '<button class="q x" data-rm="'+i+','+idx+'" aria-label="Remove">x</button></div></div>';
    }).join("");
    $("list"+i).innerHTML=h||'<div class="empty">Press + to add units</div>';
  });
  totals(sums());
}

document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var a;
  if(b.dataset.open!==undefined)return openPicker(+b.dataset.open);
  if(b.dataset.cat){cat=b.dataset.cat;return drawPicker()}
  if(b.dataset.pick!==undefined)return add(+b.dataset.pick);
  if(b.id==="close")return closePicker();
  if(b.id==="clear"){sides=[[],[]];return render()}
  if(b.id==="copy"){
    var s=sums(),line=function(i){return sides[i].map(function(r){return D[r.k][0]+" x"+r.q}).join(", ")||"nothing"};
    var txt="Trading: "+line(0)+" ("+fmt(s.t[0])+")\nLooking for: "+line(1)+" ("+fmt(s.t[1])+")\n"+$("status").querySelector("b").textContent;
    try{navigator.clipboard.writeText(txt);b.textContent="Copied"}catch(err){b.textContent="Failed"}
    setTimeout(function(){b.textContent="Copy"},1200);return;
  }
  if(b.dataset.q){a=b.dataset.q.split(",").map(Number);var r=sides[a[0]][a[1]];r.q+=a[2];if(r.q<1)sides[a[0]].splice(a[1],1);render()}
  if(b.dataset.rm){a=b.dataset.rm.split(",").map(Number);sides[a[0]].splice(a[1],1);render()}
});
document.addEventListener("error",function(e){
  var t=e.target;if(!t.classList||!t.classList.contains("pi"))return;
  var n=t.dataset.name;
  if(/^Shiny./.test(n)&&!t.dataset.tried){t.dataset.tried="1";t.src="images/"+n.slice(5).toLowerCase().replace(/[^a-z0-9]/g,"")+".png";return}
  var sp=document.createElement("span");sp.textContent=t.dataset.ph||n;t.replaceWith(sp);
},true);
document.addEventListener("input",function(e){if(e.target.id==="srch")drawPicker()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closePicker()});
$("ov").addEventListener("click",function(e){if(e.target===$("ov"))closePicker()});

/* ---- VALUES PAGE ---- */
var vp=1,VPS=10,vf={r:{},s:{}};
function vRows(){
  var q=$("vq").value.trim().toLowerCase(),rk=Object.keys(vf.r).filter(function(k){return vf.r[k]}),sk=Object.keys(vf.s).filter(function(k){return vf.s[k]});
  return D.filter(function(u){
    return u[0].toLowerCase().indexOf(q)>-1&&(!rk.length||rk.indexOf(u[1])>-1)&&(!sk.length||sk.indexOf(trend(u[5]))>-1);
  }).sort(function(x,y){return RAR.indexOf(x[1])-RAR.indexOf(y[1])});
}
function drawVals(){
  var rows=vRows(),pages=Math.max(1,Math.ceil(rows.length/VPS));
  if(vp>pages)vp=pages;if(vp<1)vp=1;
  $("vg").innerHTML=rows.slice((vp-1)*VPS,vp*VPS).map(function(u){
    var t=u[5]?trend(u[5]):"";
    return '<div class="vc gb" style="'+gs(u[1])+'"><div class="top">'+pic(u)+'<div><div class="nm">'+esc(u[0])+'</div><span class="tag">'+u[1].toUpperCase()+'</span></div></div>'+
      '<div class="cg"><div><small>VALUE</small><span class="val">'+(u[2]===null?"O/C":(u[2]===u[3]?fmt(u[2]):fmt(u[2])+"-"+fmt(u[3])))+'</span></div>'+
      '<div><small>DEMAND</small><span>'+(u[4]?esc(u[4]):"-")+'</span></div>'+
      '<div><small>STATUS</small><span class="'+t+'">'+(u[5]?esc(u[5]).toUpperCase():"-")+'</span></div>'+
      '<div><small>RARITY</small><span>'+u[1]+'</span></div></div></div>';
  }).join("")||'<div class="meta">No units match.</div>';
  $("vpn").value=vp;$("vpn").max=pages;$("vpt").textContent=pages;
  $("vpp").disabled=vp<=1;$("vpx").disabled=vp>=pages;
  var chip=function(g,k,l){return '<button class="'+(vf[g][k]?"on":"")+'" data-vf="'+g+'|'+k+'">'+l+'</button>'};
  $("vfp").innerHTML='<div class="lbl">RARITY</div>'+RAR.map(function(r){return chip("r",r,r.toUpperCase())}).join("")+
    '<div class="lbl">STATUS</div>'+chip("s","up","RISING")+chip("s","down","DROPPING")+chip("s","flat","NEUTRAL / NONE")+
    '<div class="lbl"></div><button data-vf="clear">CLEAR FILTERS</button>';
}
function showView(v){
  $("pgCalc").hidden=v!=="calc";$("pgVals").hidden=v!=="vals";
  document.querySelectorAll("nav .tab").forEach(function(t){t.classList.toggle("on",t.dataset.view===v)});
  if(v==="vals")drawVals();
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.view)return showView(b.dataset.view);
  if(b.id==="vfb")return $("vfp").classList.toggle("on");
  if(b.id==="vpp"){vp--;return drawVals()}
  if(b.id==="vpx"){vp++;return drawVals()}
  if(b.dataset.vf){
    if(b.dataset.vf==="clear")vf={r:{},s:{}};
    else{var a=b.dataset.vf.split("|");vf[a[0]][a[1]]=!vf[a[0]][a[1]]}
    vp=1;drawVals();
  }
});
document.addEventListener("input",function(e){if(e.target.id==="vq"){vp=1;drawVals()}});
document.addEventListener("change",function(e){if(e.target.id==="vpn"){vp=parseInt(e.target.value,10)||1;drawVals()}});
render();
</script>
</body>
</html>
